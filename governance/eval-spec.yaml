version: 1
updatedAt: '2026-10-15'

schema: tenger.eval/v1
layout: |
  <skill-or-domain>/evals/
    eval.yaml           # 声明 skill、用例清单、评分策略
    fixtures/           # 输入与台账快照（结构层用完整项目树）
  scripts/eval/run.py   # 唯一执行器；平台无关，无第三方依赖

layers:
  structure:
    what: 给定项目夹具 → 跑真实校验器 → 断言**具体判据文本**出现且红/绿符合预期
    cost: 秒级、零 token、零依赖 ⇒ 每次改动必跑，可当 pre-commit
    runner: scripts/eval/run.py
    validators: [artifact, gate, trace, registry, refs, transition, graph]
    assertionRule: 断言 mustContain 而非只看退出码——否则"因无关原因失败"会被当成回归通过
  behaviour:
    what: 给定 prompt 夹具 → 真跑 skill → 判模型自己的最终回答（不是整条 transcript）
    engine: codex + DeepSeek（用户现有 provider，零配置改动，2026-10-15 定案）
    engineRejected: claude 路线搁置——本机 Claude Code 不剥 cc-switch 拼在模型名后的 [1m]
            上下文规格后缀，直接判 unrecognized_model；要通必须改用户的 provider 配置，
            那不是评测该动的手
    cost: 同一条用例三次真跑实测 32,357 ／ 58,691 ／ 106,325 token
          （口径＝非缓存输入＋输出；同轮缓存输入最高 1,570,432 不计价）／1–5 分钟，
          且同一条两次结果不同 ⇒ 只在 TSR_ALLOW_ENGINE=1 时采样跑，不进默认回归；
          预算闸按最高值上浮设 150,000
    metering: 引擎取不到 token 用量即判 error，不许静默跳过预算闸（无计量＝无成本约束）
    evidence: 每次真跑把 transcript 落 .spec/obs/behaviour/（派生物不入库），失败能回查原文
    workspace: 夹具工作区建在仓内 .tmp-eval/；建在 %TEMP% 会被 codex 沙箱判不可写，
            agent 全程只读 ⇒ 把量具故障误记成 skill 违规
    rule: 禁词范围按"规则管的是什么"选单元，不按版式猜——问用户类规则锚问句行（[?？]收尾），
            分节类规则锚标题或"待你决定："标签行；单元找不到判 error，不退化为全文匹配。
            2026-10-15 同一条用例两次真跑给出两种版式，节标题锚点抖过一次 ⇒ 才换成问句锚点

caseTiers:
  L0: 每个 skill ≥1 条「最小输入 → 必需产物存在且 Gate 合法」；红即阻断
  L1: 每个 skill 3–5 条，覆盖 Procedure 的关键分支；红进 issue 不阻断
  L2: issue/ 每个 P0/P1 闭环后必须回流成 1 条；未回流不得标闭环
  L3: 改 shared/ 或合并 skill 前全量；红阻断合并

issueRef:
  # L2 的接线字段：用例声明里的可选键。不新增流程节点，也不要求任何 skill 多产出一份文档
  field: issueRef
  value: issue/<skill>/<日期>/<NN>-<标题>.md（仓库相对路径＝本仓条目稳定标识，见 issue/README.md
    与 shared/templates/issue-template.md；也接受只写到 <NN> 的短写，但必须唯一命中）
  form: 单条字符串或多条字符串
  enforcement:
    - scripts/eval/relay.py 双向核对：已沉淀的 P0/P1 没有任何用例指回 ⇒ 报缺回流、退出码 1（未回流不得标闭环）
    - scripts/eval/run.py：用例写了 issueRef 却解析不到条目 ⇒ 该条判 error，不判绿（覆盖率不许靠猜的关联凑）
    - 状态口径照 issue/README.md 状态机读实名字段（「优化状态」，老条目写「状态」也读）；闭环＝已沉淀；
      已忽略不要求用例；状态词落在枚举外（复发重开、已修规则…）的单列「判不了」如实报数，不默认它通过
  honesty: 只对得上判据原文的才声明——issue 的「修复方向／修复判据／沉淀位置」要能对上用例的 mustContain
    或被 tamper 破坏的那一节；对不上就留空并如实报缺口，禁止用弱关联凑覆盖率

l2Triage:
  # 「不可机械化者留在清单里写明原因」（排序第 3 格的 ☑ 判据后半句）此前只是散文，没人核对它是否与现状一致。
  # 本节的职责：让「缺回流」的每一条都必须有一个**当场分诊过的结论**，新增缺口若未分诊就报红；
  # 反过来，名单里已经不再缺的条目要报「名单过期」——但那是好消息，不因此判红（惩罚进展就是把判据调反）。
  rule: "audit().missing 的每一条 issue 必须在本节 declared 里出现（verdict 三值之一）；不在 ⇒ 未分诊、判红。"
  coverageRule: >-
    已回流必须分「结构层可判」与「仅行为层」两列报。只有行为层用例指回时标「待授权（未跑）」，
    不得并进「已拦住」的读数——行为层在夜间一律 blocked 是常态，混着报就是新的假绿面。
  declared:
    # 2026-10-17 并发会话把 5 条接成行为层用例（EV-FE-103／EV-PRD-102／EV-PRD-103／EV-SOPT-101／EV-TDD-103），
    # 缺口消失、名单过期（relay 只报数不判红）；本轮据「名单过期」清单逐条摘除，只留仍缺回流的这一条。
    - issue: issue/Frontend-Dev/2026-09-16/02-案例升级为主流程标准SOP.md
      verdict: 证据双侧交集为空
      reason: >-
        判据是「义务有没有落进主流程强制位（REQUIRED／Gate／错误表行）」；两侧标题都 0 命中
        （真实侧「落点」35 处指的是评审「修复落点」，不同义）⇒ 交集为空是数出来的，不是推断的
  texts:
    undeclared: >-
      分诊核对：新增缺回流未分诊 ⇒ 每条缺口要么接成用例、要么写明不可机械化的结论与证据，
      否则 L2「未回流不得标闭环」就退化成「欠账数在涨但没人看过」
    stale: >-
      分诊核对：名单里有条目已不再缺回流（用例接上了或 issue 状态变了）⇒ 名单过期，
      本轮只如实报数不判红——惩罚进展会把判据调反
    clean: "分诊核对：缺回流逐条都有分诊结论，未分诊 0 条"
    behaviourOnly: >-
      仅行为层回流：这些条目的 issueRef 用例全是 behaviour 层，未授权时一律 blocked ⇒
      只证明「用例已登记」，不证明「规则现在能拦住」；标「待授权」，不得并进「已拦住」的读数
    missingPolicy: >-
      分诊核对读不动：governance/eval-spec.yaml 未声明 l2Triage 或 declared 为空 ⇒
      「清单外默认通过」正是量具腐烂的方式，本轮按红处理而不是跳过

judgeRouting:
  rule_based: 硬约束（必含章节、必引用某文件、禁用术语、digest 一致）——默认选择
  script:     结构校验，直接调用 validate_core/tsr 的检查函数返回 0-1
  agent_judge: 仅语义判断（方案是否闭环、还原度、澄清是否问到该问的），必须附 rubric 与反例
  budgetRule: 单套 case 里 agent_judge 占比 ≤30%；量具能算出的一律不交给模型

comparability:
  baseline: 每套 eval 首次通过的 result 快照存 evals/<set>/baseline/result.json（入库真相，不是派生物）
  bind: [skillRevision, casesVersion, engine, model, judgeVersion, scoringVersion]
  derive: 锚一律从仓库字节算出，不接受手填（手填锚等于又一个自述）。skillRevision＝被测 skill 正文目录
    （governance/skill-registry.yaml 解析 path）＋ shared/ 的摘要；casesVersion＝用例判据字段
    （除 name 外全部）＋夹具树的摘要；engine/model＝行为层用例声明的引擎与模型，无行为层记
    structure-only／engine-default；judgeVersion＝scripts/eval/run.py 判据语义版本，改语义必须手工 +1
    （run.py 字节另存 provenance，变了却没升版只在 diff 里报警，不进锚）；scoringVersion＝
    governance/scoring.yaml 的 version。skillRevision 故意不用 commit sha：commit sha 每次无关提交都变，
    diff 会几乎永远拒绝比较，量具就废在手上；而真改了 SKILL.md 正文那天被测物确实变了，该开新基线
  rule: 锚任一项变化即开新基线；禁止跨锚比总分
  enforcement:
    - scripts/eval/baseline.py save —— 只在无 failed 且无 error 时落基线；blocked（行为层未跑）如实记进快照，
      基线因此只声明结构层，不冒充行为已验收
    - scripts/eval/baseline.py diff —— 锚不一致 ⇒ 拒绝比较并报错（退出码 2），一个差值都不给；
      输出必须带口径声明（比的是什么、不比什么、行为层没跑）；派生报告写 .spec/obs/（gitignore）
  holdout: 保留 10–20% 用例不参与优化，仅在验收时跑；总分不降而 holdout 降 ⇒ 判过拟合

verificationOfTheHarness:
  # 评测自己先要可信，否则它只是另一个自述
  negativeControls:
    - 把期望从 red 改成 green，必须报 failed
    - 合规夹具被改坏后仍期望 green，必须报 failed
    - mustContain 写成不存在的判据文本，必须报 failed
  detectionRateSource: scripts/obs/selfcheck.py 的 7 探针 + 1 干净对照 → detection.json → 打分 D3

antiPatterns:
  - 用 agent_judge 评 agent 产物却不给 rubric（错误会自我强化）
  - 同一会话改完自评（必须 fresh-agent）
  - 无人值守定时任务跑 agent_judge（污染被观测语料且需 Full Access）
  - 把"覆盖率高"当质量：判据未核实的类型宁可不声明，覆盖 0.5% 也要如实显示

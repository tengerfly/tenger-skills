version: 1
purpose: >
  Single source for node identity. A run-log event naming an unregistered node is a
  defect, not a data point: invented node ids silently break every per-node metric.
# paths = 该节点的产物落盘位置；适配器据此把宿主侧写盘事件归属到节点（主判据，
# 实测 qoder 的 Skill 调用事件只有 114 条，撑不起节点归属）。
nodes:
  - {id: idea-intake, skill: idea-intake, paths: [".spec/intake/**"]}
  - {id: product-discovery, skill: product-discovery, paths: [".spec/research/**", ".spec/discovery/**"]}
  - {id: competitive-analysis, skill: competitive-analysis, paths: [".spec/research/**"]}
  - {id: product-definition, skill: product-definition, paths: [".spec/decisions/**"]}
  - {id: application-blueprint, skill: application-blueprint, paths: [".spec/blueprint/**"]}
  - {id: feature-decision, skill: feature-decision, paths: [".spec/features/**"]}
  - {id: prd-design, skill: prd-design, paths: [".spec/prd/**"]}
  - {id: prd-review, skill: prd-review, paths: [".spec/需求评审/**"]}
  - {id: prototype-design, skill: prototype-design, paths: [".spec/原型/**"]}
  - {id: prototype-review, skill: prototype-review, paths: [".spec/原型评审/**"]}
  - {id: ui-ux-design, skill: ui-ux-design, paths: [".spec/设计稿/**"]}
  - {id: ui-ux-review, skill: ui-ux-review, paths: [".spec/设计评审/**"]}
  - {id: oss-radar, skill: oss-radar, paths: [".spec/开源情报/**", ".spec/技术方案前置/**"]}
  - {id: backend-tech-design, skill: backend-tech-design, paths: [".spec/TDD/**"]}
  - {id: frontend-tech-design, skill: frontend-tech-design, paths: [".spec/FTDD/**"]}
  - {id: tech-review, skill: tech-review, paths: [".spec/技术方案评审/**"]}
  - {id: backend-dev, skill: backend-dev, paths: ["src/backend/**", "apps/**"]}
  - {id: frontend-dev, skill: frontend-dev, paths: ["src/frontend/**", "web/**"]}
  - {id: code-review, skill: code-review, paths: [".spec/代码评审/**"]}
  - {id: fidelity-review, skill: fidelity-review, paths: [".spec/页面还原评审/**"]}
  - {id: auto-test, skill: auto-test, paths: [".spec/测试/**", ".spec/evidence/**"]}
  - {id: quality-inspection, skill: quality-inspection, paths: ["scripts/obs/**", "scripts/eval/**", "governance/**", "evals/**", "scripts/tests/**"]}
# 指标注册表：每个指标声明所需 capability、语料基数与 N/A 口径，代码按本表执行（单一来源）。
metrics:
  - id: rule_hit_rate
    name: 规则命中率
    pillar: 智能化
    definition: SKILL.md / shared 契约条款被真实读取或引用的比例（plan v2 §3）
    use: >
      只用于「哪些 skill 正文该精简」的数据依据；不参与打分、不是放行依据，
      低命中只说明「轨迹里没有证据」，不等于该条款无价值（宿主注入正文不留日志 ⇒ 下界）。
    truthSource: 宿主日志的读取/引用事件，全部经 governance/host-specs/<host>.yaml 取值
    excludedSource: >
      不用 .spec/obs/run.jsonl：第一批真实事件只有 1 个节点 2 条，样本撑不起条款基数，
      用它算命中率就是拿噪声当比例。
    capabilities:
      required: [TOOL_EVENTS, CLAUSE_READS]
      readChannel: CLAUSE_READS
      citeChannels: [EVIDENCE_TEXT]
    corpus:
      - {from: skill-registry, status: active, file: SKILL.md, unit: 二级标题}
      - {glob: "shared/*.md", unit: 二级标题}
    minCiteChars: 4
    judge: >
      命中 = 条款被显式读取（带 offset/limit 的读取只算行区间覆盖的条款，整篇读取算全部）
      或被引用（条款标题原文与其文件指针同现于一条被观测到的工具参数里）。
      shell 文本不解析（各家命令行写法不同，解析即猜测）；引用通道缺 EVIDENCE_TEXT 时记
      N/A 并把命中率降级为「仅读取通道」，不冒充两通道。
    naRule: >
      必需 capability 未授予 ⇒ 整个指标 N/A 并写明缺哪个字段；授予了但零命中 ⇒ 0.0
      （零命中是真信号，不能写成 N/A）；条款基数为空 ⇒ N/A，禁止退化成 100%。
    bias: >
      只统计被采样的 session，未采到的语料按未命中计 ⇒ 报告值是下界，禁止当上界引用；
      本仓自身的维护会话也在读正文，算之前用 --project-slug 限定被观测项目。
# ── 智能化指标②：同型问题复发率（plan v2 §3 第二条 + §5「应随反哺下降」）。口径只有一条：**显式复发指针**。
# 作废口径（不得走回头路）：按「标题去掉日期数字后的主干词」聚指纹——实测两头都错：没有 `# ` 标题行的卡
# 回退用路径当标题，把同目录两张**不同问题**并成「同型」（假阳性）；而真写了「第 3 次复发」的卡一条没检出
# （假阴性）。所以配对一律只认卡片正文里逐字存在的两类指针，其它相似度都不算。
# 语料是历史证据、只读：本指标不改写任何卡、不新建卡、不要求任何 skill 新产出文档。
recurrence:
  version: 1
  id: same_type_recurrence_rate
  name: 同型问题复发率
  pillar: 智能化
  definition: "同一 skill 下由显式复发指针串起来的 A→B→C 复发链，与滚动窗口内的复发卡片占比（plan v2 §3 第二条）"
  truthSource: "issue/ 卡片正文里的显式复发指针（指针原文 + 文件:行号，逐条可点回去核对）"
  recompute: "./.venv/Scripts/python.exe scripts/tsr.py --project-root . recurrence"
  use: >
    只用于判断「反哺之后同类问题有没有少起来」。分母是 issue/ 卡片数、不是运行次数，
    且口径只认卡片里写明的指针 ⇒ 报告值是「已被记录下来的复发」，不是「全部复发」。
    不参与打分、不是放行依据。
  # 配对禁区（代码不得实现其中任何一种；本节是判据来源，不是注释）：
  forbidden:
    - "标题相近／路径相近／去掉日期后的主干词指纹配对（上一版假阳性的来源）"
    - "正文出现「复发」二字就算复发（只有真正带显式指针的才计入）"
    - "把「没扫到／读不动」写成「没复发」（读不动与非日期目录单独计数，不折进 0）"
    - "把「未解析到的指针」拿相近标题冒替"
  corpus:
    glob: "issue/*/*/*.md"      # 深度 3：<池根>/<Skill>/<日期>/<序号>-<标题>.md；issue/README.md 在深度 1，天然不匹配
    layout: "issue/<Skill>/<YYYY-MM-DD>/<NN>-<标题>.md"
    skillFrom: grandparentDir   # 代码只认这个值：skill = 父目录的父目录名；写成别的值 ⇒ 拒绝开工（不猜取法）
    dateFrom: parentDir         # 代码只认这个值：日期只取父目录名，禁止从正文猜
    datePattern: '^\d{4}-\d{2}-\d{2}$'
    cardPattern: '^(\d{2})'     # 文件名前两位 = 同日多张卡之间的先后
    excludeFileNames: ["README.md"]
    encoding: utf-8
  # 取值闸门：以上每个取数／配对策略的代码实现只认这张表里的字面值。声明了别的值 ⇒ 拒绝开工并报错，
  # 不猜一套、也不退回实现里的某个分支（同 attribution.headingAnchors.match 的先例）。
  recognized:
    corpus.skillFrom: grandparentDir
    corpus.dateFrom: parentDir
    window.cutoffPolicy: latestCardDate
    chain.scope: sameSkill
    chain.order: ascendingByDateThenCard
    rate.numerator: recurrenceCardsInWindow
    rate.denominator: cardsInWindow
    rate.dedupe: byCard
  badValueReason: "{key} 声明的是「{value}」，本代码只实现「{expect}」⇒ 拒绝开工（口径不认识就是没口径，不猜一套出来）"
  window:
    days: 30                    # 滚动窗口天数只写在这里，代码不硬编码
    inclusiveStart: true        # 窗口含首尾两天 ⇒ 起点 = 切点 -(days-1)；写成 false 就是右开一天，如实换口径
    badDaysReason: "window.days 声明的是「{value}」，必须是正整数 ⇒ 拒绝按这个窗口开工（不退回任何默认天数）"
    cutoffPolicy: latestCardDate
    cutoffReason: "切点取语料里最新的卡片日期，报告里写明具体值（不拿今天、不拿文件 mtime 冒充切点）"
  pointers:
    # ① 序数复发：第 N 次复发（阿拉伯数字／中文数字／全角数字都算，允许「第 3 次复发」这类空格）
    ordinal:
      pattern: '第\s*(?P<numeral>[０-９0-9一二两三四五六七八九十百千零]+)\s*次\s*复发'
      label: 序数复发
      numeralGroup: numeral
      direction: 本卡声称这是第 N 次
    # ② 指回旧卡的引用：issue/<Skill>/<日期>/<NN>…（允许 ../../ 前缀、允许省略 .md、允许 01-*.md 这类通配尾巴）
    issueRef:
      pattern: '(?:\.\./)*issue/(?P<skill>[^/`，、；\s]+)/(?P<date>\d{4}-\d{2}-\d{2})/(?P<card>\d{2})'
      label: 旧卡指针
      groups: [skill, date, card]
      direction: 本卡指回更早的卡
    numerals: {零: 0, 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10}
    missingGroupReason: "注册表声明的指针模式里没有命名组「{group}」⇒ 取不了数（不猜组、不拿整串匹配冒替）"
  # 成链判据（全部机械，四条件同时成立才成一条边）：
  #   ① 指针能在语料里解析到一张卡：skill 目录名逐字相等（仅大小写折叠）＋日期相等＋序号相等；
  #   ② 目标严格早于本卡（先比日期，同日比序号）⇒ 同日「另登/联动落点」不会被当成复发；
  #   ③ 指针不指向自己（`# ../../issue/<自己>` 这类占位自指路径实测存在）；
  #   ④ 同一行还带复发记号 ⇒ 只「引用旧卡」而没有任何复发字样的，算待裁决的交叉引用，不算复发。
  chain:
    scope: sameSkill
    order: ascendingByDateThenCard
    requireCue: true
    cueWords: ["复发"]
    snippetField: "指针原文片段"
    locationField: "指针位置"
  rate:
    label: 复发率
    numerator: recurrenceCardsInWindow    # 分子=窗口内「自己带显式指针指回更早同 skill 卡片」的卡片数
    denominator: cardsInWindow            # 分母=窗口内卡片数（读不动的卡不入分母，见 reasons.unreadable）
    dedupe: byCard                        # 一张卡指向多张旧卡只算一次复发（复发的是这张卡，不是指针条数）
  report:
    outputFile: ".spec/观测/同型问题复发率.md"
    naToken: "N/A"
    maxSnippetChars: 200
    snippetEllipsis: "…"
    maxListItems: 25          # 旁证清单一次最多铺这么多条（多出来的如实报「未列 N 条」，不静默截断）
  naRule: >
    语料 glob 命中 0 张 ⇒ N/A（没语料不是「0% 复发」）；没有任何合法日期目录 ⇒ 切点取不到 ⇒ N/A；
    窗口／语料键缺失或取值不认识 ⇒ 直接报错拒绝开工，不退回默认值。扫描成功但零复发 ⇒ 如实报 0.0
    并附「0 = 卡片里没写显式指针，不等于问题没复发」的口径声明——口径窄是窄，不许读成没问题。
  reasons:
    noCorpus: "语料 glob 未命中任何卡片 ⇒ 无基数，不是 0% 复发（是没得算）"
    noCutoff: "没有任何合法日期目录 ⇒ 切点取不到（不拿文件 mtime 或巡检时刻冒充卡片日期）"
    unreadable: "卡片读不动 ⇒ 既不计复发也不计未复发，单列交人处置"
    nonDateDir: "日期目录名不合 corpus.datePattern ⇒ 该卡不入窗口基数（不从正文猜日期）"
    irregularName: "文件名不合 corpus.cardPattern ⇒ 同日先后无从判定，不入基数（不拿整名当序号）"
    excluded: "文件名命中 corpus.excludeFileNames ⇒ 不是卡片（如 issue/README.md 这类说明文件）"
    recurrenceEdge: "指针可解析＋目标严格更早＋同 skill＋同行有复发记号 ⇒ 计为一条复发边"
    unresolved: "指针在语料里解析不到对应卡片 ⇒ 不成链（不拿相近标题冒替）"
    ambiguous: "同一 skill+日期+序号在语料里命中多张卡 ⇒ 指针有歧义，不挑一张"
    forwardRef: "指针指向更晚日期或同日更晚序号 ⇒ 不是「指回旧卡」，不成链"
    selfRef: "指针指向本卡自己 ⇒ 占位自指路径，不成链"
    crossSkill: "指针指向别的 skill 的卡 ⇒ 本指标按「同一 skill 下 A→B→C」计链，跨 skill 只作旁证列出"
    cueless: "只有旧卡引用、同一行没有复发记号 ⇒ 算交叉引用不算复发，单列交人裁决"
    unparsedOrdinal: "序数词不在 pointers.numerals 里 ⇒ 记为「序数无法解析」，不猜一个数"
    ordinalWithoutChain: "写了「第 N 次复发」但没有可解析的旧卡指针 ⇒ 如实列为未成链声称，不计入复发率，交人裁决"
    zero: "扫描成功但没有任何显式指针 ⇒ 复发链 0 条、复发率 0.0；这是「卡片里没写」，不是「问题没复发」"
  caveats:
    narrowScope: "口径只认卡片正文的显式指针：卡片没写指针的复发扫不出来 ⇒ 报告值是下界，禁止当上界引用"
    notAbsence: "0 条链的含义是「语料里没有显式指针」，不等于「没有复发」；补指针要由人改卡，本工具不替人写"
    denominatorNote: "分母是窗口内可解析日期的卡片数（issue/README.md 不计），不是运行次数，也不是节点数"
# ── 闭环中间段①：检测面 → 候选问题卡（plan v2 §5）。判据与文案全部在本节，代码只执行不硬编码。
# 候选卡只登记「哪个检出面在说什么对不上」＋机器派生指针，不判定问题成立、不分级、不落 issue/。
candidates:
  version: 1
  outputDir: ".spec/obs/candidates"
  idPrefix: "CAND-"
  label: "候选·未经确认"
  statusValue: "候选·未经确认（未分诊，不等于问题成立）"
  gradeValue: "未定级——P0/P1 分级属人的判定，生成器不得代填"
  forbidWriteInto: ["issue"]
  maxEvidenceChars: 240
  maxArtifactsPerCard: 12
  recompute: "./.venv/Scripts/python.exe scripts/tsr.py --project-root . candidates --write"
  windowRule: "同 executionId + node 的 node-start → node-end ts，取自 run.jsonl 的机器时钟（不是回忆）"
  boundary: "候选卡是镜像不是真相：同 kind+evidence 才去重；不再命中的旧卡只报不删，由人处置"
  naReasons:
    noExecution: "该检出面在 run-log 里没有对应事件 ⇒ 无 executionId 可指（不猜、不拿相近事件冒替）"
    noWindow: "run-log 里没有成对的 node-start/node-end ⇒ ts 窗口取不到（不拿文件 mtime 冒充节点窗口）"
    noCloseTs: "该执行还没有 node-end ⇒ 收口时刻取不到（不拿巡检时刻冒充收口）"
    noArtifact: "该检出行没有可绑定的产物指针（事件未绑定产物，或判据核的是关联不是字节）⇒ 无涉事产物可列，不编"
    fileGone: "磁盘上已无此文件 ⇒ 现值 sha256 取不到，只保留台账记录值"
    noBinding: "该路径没有被任何 node-end 绑定过 ⇒ 台账记录值取不到（这本身正是本条异常的内容）"
    noLog: "项目没有 run-log ⇒ 观测未接入，无指针可派生"
    relayGap: "回流缺口是「台账↔用例」的关联缺失，不是某次执行的观测异常 ⇒ 无 executionId、无节点窗口可给（不拿相近事件冒替）"
  surfaces:
    verify: {name: "tsr verify", judgeSource: "scripts/tsr.py:verify / obs.check_bindings"}
    report: {name: "tsr report 看板派生", judgeSource: "scripts/tsr.py:cmd_report + scripts/obs/metrics.py:summarize"}
    gitlog: {name: "tsr audit · git 轨巡检", judgeSource: "scripts/obs/gitlog.py:find_gaps"}
    relay: {name: "L2 回流执法", judgeSource: "scripts/eval/relay.py:audit", ruleSource: "governance/eval-spec.yaml:caseTiers.L2"}
  kinds:
    unregisteredNode: "节点名未注册"
    unclosedNode: "节点未收口"
    uncommitted: "改动未提交"
    missingBackflow: "缺回流用例"
    danglingRef: "悬空 issueRef"
    unreadableEval: "评测集读不动"
    bindingDrift: "产物改了没落台账"
    artifactGone: "产物已从磁盘消失"
    contract: "run-log 契约违规"
    noObservability: "观测未接入"
  # ── 闭环中间段：候选卡 → **人的确认**（plan v2 §5 的人在环关口；夜间自主会话不得代填）。
  # 确认记录落在 confirmation.dir，与派生区分开：`.spec/obs/candidates/` 被 .gitignore 忽略、
  # 四个检出面随时可重算；确认是「这个问题到底成不成立」的判定证据，不可重算、必须入库可回查。
  # 生成器**永不写**这个目录（落点由 _assert_allowed 机械兜底），人只填三个字段就能出闭环率。
  confirmation:
    version: 1
    dir: ".spec/obs/confirmations"
    fileName: "{id}.yaml"
    schema: "tenger.confirm/v1"
    fieldNames: {actor: "确认人", time: "确认时间", conclusion: "结论"}
    unconfirmed: "未确认（属人判定，生成器不得代填）"
    conclusions:
      成立: "问题成立 ⇒ 进入闭环：由人升级为正式问题卡并定级，修复后带回归指针"
      不成立: "检测面误报 ⇒ 交量具侧修正（归因段/skill-optimizer），不改被观测对象"
      待定: "证据不足 ⇒ 与未确认同等待遇，不计入闭环率"
    excludedConclusions: ["待定"]
    closureConclusion: "成立"
    commitPattern: '\b[0-9a-f]{7,40}\b'
    autoActors: ["main", "agent", "generator", "tsr", "autonomous-night", "ai", "auto"]
    closureFieldNames: {issue: "升级为", commit: "回归"}
    rules:
      protocol: "确认协议（人在环）：确认人／确认时间／结论三字段缺一不可，未填即计「未确认」"
      noSelfConfirm: "自动执行者不得代填确认：确认人命中 candidates.confirmation.autoActors ⇒ 判非人确认，该卡计「无效」"
      unconfirmedNotCounted: "未确认不计入闭环率：分子分母都只算「已确认且结论=成立」的卡；未确认／待定／无效单独报数"
      emptyDenominator: "已确认成立的卡为 0 ⇒ 闭环率 N/A：空集不判通过，不得把 0/0 写成 0% 或 100%"
      timestamp: "确认时间必须是 ISO-8601 带时区时刻且不晚于本机时钟：格式不合法或未来时刻判「无效」，不拿文件 mtime 冒充确认时刻"
      closedNeeds: "闭环＝结论「成立」＋`升级为` 指向的正式问题卡文件真实存在＋`回归` 指针经 git cat-file 验真；缺一即计未闭环（只认机器查得到的，不认文字声称）"
      shape: "确认文件必须是 YAML 映射且含声明字段：读不动／不是映射／缺字段一律判「无效」并写明原因，不当没确认糊过去"
      naSection: "确认协议：N/A —— 本轮没有读取确认文件（collect 未附确认段）⇒ 没读取不等于未确认，更不等于已确认"
      splitStorage: "确认记录与派生区分开存放：派生区被 .gitignore 忽略、四个检出面随时可重算，而判定证据不可重算 ⇒ 必须入库可回查，重算候选卡不会覆盖人的判定"
# ── 闭环后段①：候选卡 → 具体 skill 的具体条款（plan v2 §5「归因到具体 skill 的具体条款（读轨迹原文）」）。
# 归因只走注册表反查：每一跳都要能点回原文核对。找不到可证据化条款就落「未归因」，禁止猜、
# 禁止把「最像的那段」当成责任条款；多命中全部列出并交人裁决。
# 证据两类，口径都是**逐字**，没有第三类：
#   ① needle 逐字出现在二级标题段的正文里（原口径，未放宽）；
#   ② 锚点词逐字出现在该二级标题的标题文本里（章节级同义锚点，见 headingAnchors）。
# ②只是修「锚点太窄 ⇒ 把量具故障记成被观测对象的违规」这一格：它只回答「该 skill 正文里有没有
# 自己承接这条义务的章节」，不替代①、也不许用「内容看起来相关」当证据；两类证据全部并列输出，
# 命中多处仍是一律「多归属，需人裁决」，代码不挑一个。
attribution:
  version: 1
  label: "归因（条款级）"
  truthSource: "候选卡的涉事产物指针 + governance 注册表反查 + skill 正文原文（全程只读，不改任何正文）"
  recompute: "./.venv/Scripts/python.exe scripts/tsr.py --project-root . candidates"
  verdicts:
    attributed: "归因（唯一条款证据）"
    multiple: "多归属，需人裁决"
    none: "未归因（无条款证据）"
  # 路径 → 节点/skill 的每一跳。多条路由同时命中不同 skill ⇒ 多归属，不自行挑一个。
  routes:
    - id: artifactPathsGlob
      source: "governance/obs-registry.yaml:nodes[].paths"
      evidence: "obs-registry.yaml 的该节点声明行"
      detail: "涉事产物路径按 nodes[].paths 的 glob 反查节点 ⇒ 节点声明的 skill；一个路径可被多个节点 glob 覆盖，全部列出"
    - id: runLogNode
      source: "governance/obs-registry.yaml:nodes[].id"
      evidence: "obs-registry.yaml 的该节点声明行"
      detail: "候选卡自带的 node 字段（取自 run-log 事件，不是回忆）反查同 id 节点 ⇒ 节点声明的 skill"
    - id: issuePoolDir
      source: "governance/skill-registry.yaml:skills[].id + legacyAliases"
      evidence: "skill-registry.yaml 的该 skill 声明块行号"
      detail: "issue 池路径的 <Skill目录名> 段与注册表 id/legacyAliases 逐字相等（仅大小写折叠）才算命中；差一个字母就不算"
      schema: "issue/<Skill目录名>/<日期>/<序号>-<标题>.md"
      directorySegment: 1
  # 条款语料：该 skill 自己的正文，加上「该 skill 正文里逐字引用到文件名」的仓根 shared 契约。
  # 不默认把全仓 shared 塞进语料：那样任何一条 shared 措辞都会伪装成每个 skill 的责任条款。
  # 口径按 plan v2 §5 的字面范围收窄到 SKILL.md + shared/*.md（宁窄勿宽）：references/assets 里
  # 的相似措辞不算责任条款，宁可落「未归因」也不把最像的那段当结论。
  corpus:
    skillFiles: ["{skillPath}/SKILL.md", "{skillPath}/shared/*.md"]
    sharedGlob: "shared/*.md"
    sharedGate: "只有该 skill 的 SKILL.md 正文逐字出现该 shared 文件名，才把它纳入该 skill 的语料"
  # 条款 = 一个「## 二级标题 + 到下一个二级标题前的正文」。needle 必须落在**正文**（不含标题行）。
  clauseUnit: h2-section
  headingPattern: '^##\s+\S'
  bodyOnly: true          # 只对 needle 成立：正文逐字口径没有放宽；标题这一侧只认下面的锚点词
  caseSensitive: true
  maxClauseChars: 900
  # ── 章节级同义锚点：认「该 skill 正文自己承接了这条义务」的章节。
  # 命中口径仍是逐字，且只在「## 标题行的标题文本」里查锚点词（不做相似度、不看正文语义）。
  # 锚点词表全部写在各 kind 的 anchors 里，代码零硬编码常量；本块只放机制与文案。
  headingAnchors:
    enabled: true
    match: heading-verbatim   # 代码只认这个值；写成别的值 ⇒ 拒绝按锚点执法并报 N/A（不猜口径）
    minChars: 4               # 短锚点会把无关章节卷进来（判据宁窄勿宽）：低于此长度的锚点词一律不启用
    needleEvidence: "正文逐字命中 needle（operative 判据词落进了这段正文）"
    anchorEvidence: "标题逐字命中锚点（只证明该 skill 有承接章节，不证明该段正文写出了判据原文）"
    shortAnchorReason: "锚点词「{anchor}」长度 {length} < headingAnchors.minChars={minChars} ⇒ 不启用（短词会把无关章节算成承接，判据宁窄勿宽）"
    badMatchReason: "headingAnchors.match 声明的是「{match}」，不是本代码实现的 heading-verbatim ⇒ 拒绝按锚点执法（口径不认识就是没口径，不猜一套出来）"
  # ── 防刷分闸：承接集中度报警。一条条款撑起大部分证据 = 覆盖面窄，不是覆盖得好；
  # 这种情况下「命中率再高」也不能当质量结论——把量具的覆盖偏差记成被观测对象的成绩，是本仓要防的同一类错误。
  concentration:
    maxClauseShare: 0.6       # 单一条款承担的证据占比 ≥ 此值 ⇒ 报警（阈值写在注册表，代码不硬编码）
    minEvidence: 3            # 证据总数低于此值不报警：两三条证据算比例是噪声，不是信号
    alarmLabel: "承接集中度异常"
    unusableLabel: "本次证据化命中率不可当质量结论使用"
    reason: "同一条款承担的证据占比 {share} ≥ 阈值 {threshold} ⇒ 说明该义务只在这一条条款上被找到（覆盖面窄），不是各 skill 都承接得好"
    offSampleReason: "条款证据总数 {evidence} < concentration.minEvidence={minEvidence} ⇒ 占比再高也不报警（样本太小），但这不等于分散，如实标注未判"
  # 每类候选 kind 的 needle 组（逐字命中即算条款证据）。needle 取判据原文里的 operative 词，
  # 或由卡面指针机械代入（{issueDir} = 涉事产物的 issue 池目录段）。空列表 ⇒ 该 kind 无从归因，如实落未归因。
  # anchors 只给「45 份 SKILL.md 里实测确有逐字相同二级标题」的 kind。其余 kind 一律不声明：
  # 逐字核过没有同义标题（如「未提交/台账绑定/未收口/issueRef」都不在任何 ## 标题里），编一个锚点
  # 就是把判据放宽成猜测——那类卡继续落未归因，并在卡面给出判据原文的行号，交人裁决。
  kinds:
    缺回流用例:
      needles: ["回流", "回归用例", "反哺记录"]
      # 锚点词 = 45 份 SKILL.md 里逐字存在的二级标题（不是本仓编的词）：
      # `## 问题记录与恢复（执行必需）` 45/45、`## …、运行问题埋点` 16/45。
      anchors: ["问题记录与恢复", "运行问题埋点"]
      anchorsBasis: "锚点承接的是「记录→反哺」义务族本身；实测全仓 45 份正文里「回流/回归用例」改前只出现 1 次（bug-fix）"
      anchorsLimit: "⇒ 锚点命中只证明「该 skill 有自己承接的章节」，不证明 L2 回流判据落进了正文；判据仍只在 eval-spec.yaml + relay.py"
      basis: "判据原文（governance/eval-spec.yaml:caseTiers.L2「闭环后必须回流成 1 条；未回流不得标闭环」）"
      ruleSource: "governance/eval-spec.yaml:caseTiers.L2"
      note: "needle 只取判据原文里的 operative 词；不用「反哺」这类泛词——它在 skill 正文 12 个文件里命中，"
      note2: "多数说的是 OSS-Radar 选型反哺，与回流义务无关（把最像的那段当责任条款就是本仓要防的造假）"
    产物改了没落台账:
      needles: ["没落台账", "改了正文", "重新绑定", "重签", "contentDigest", "内容指纹"]
      basis: "判据原文「artifact edited after node-end ⇒ 改了正文没落台账」的 operative 词"
      codeEnforcedBy: "scripts/tsr.py:check_bindings（该判据由脚本执法；skill 正文无对应条款时落未归因，不硬凑一段正文当责任条款）"
    节点名未注册:
      needles: ["节点名", "未注册"]
      codeEnforcedBy: "scripts/obs/metrics.py:summarize + governance/obs-registry.yaml:nodes[].id"
    节点未收口:
      needles: ["node-end", "收口"]
      codeEnforcedBy: "scripts/obs/candidates.py:unclosed_pairs"
    改动未提交:
      needles: ["改动未提交", "未提交"]
      codeEnforcedBy: "scripts/obs/gitlog.py:find_gaps"
    悬空 issueRef:
      needles: ["issueRef", "悬空"]
      codeEnforcedBy: "scripts/eval/relay.py:audit"
    评测集读不动:
      needles: []
      codeEnforcedBy: "scripts/eval/relay.py:audit"
    run-log 契约违规:
      needles: ["run-log", "tenger.trace/v1"]
      codeEnforcedBy: "scripts/tsr.py:verify"
    观测未接入:
      needles: ["instrumentation-guide", "tsr"]
      codeEnforcedBy: "shared/instrumentation-guide.md"
# ── 闭环后段②：进化台账 before/after 执法（plan v2 §3 台账规则 + §6 M6）。
# 规则原文：每条进化必须挂 before/after，无指标一律标「未验证」，禁止写「已优化」。此前纯纸面。
evolutionLedger:
  version: 1
  path: "evolution/进化台账.md"
  truthSource: "台账正文（只读；本命令不改写台账、不替人补指标）"
  entryHeading: '^#{2,4}\s+E-\S+'
  honestVerdict: "未验证"
  claimingVerdict: "已验证"
  verdictValues: ["已验证", "未验证"]
  claimWords: ["已优化", "已生效", "已验证", "已闭环"]
  forbiddenWords: ["已优化"]
  beforeToken: "before"
  afterToken: "after"
  beforePattern: 'before[^→\n]*[0-9]'
  afterPattern: 'after[^→\n]*[0-9]'
  sourcePattern: '`[^`]+`'
  acceptedSources: ["tsr report", "tsr score", "tsr verify", "tsr audit", "tsr candidates",
                    "validate_core", "detection.json", "eval-report.json",
                    "eval-baseline-diff.json", "baseline/result.json", "relay.py"]
  fields:
    proof: "效果证据"
    verdict: "判定"
    commit: "落账 commit"
    rollback: "回滚方式"
  # 每条进化记录（含「未验证」）都必须具备这四项：before/after 走「效果证据」行，判定走「判定」行。
  # 「未验证」是合法态，但合法不等于可以空白：数值取不到就写 N/A + 原因，字段行本身不许缺。
  requiredFields: ["效果证据", "判定", "落账 commit", "回滚方式"]
  naToken: "N/A"
  naReasonPattern: 'N/A[^0-9\n]*（[^）\n]{4,}）'
  commitPointerPattern: '\b[0-9a-fA-F]{7,40}\b'
  rollbackTargetPattern: 'git\s+(revert|checkout)\b'
  git:
    readonly: true
    verifyCommand: "git -C <repo> cat-file -e <sha>^{commit}"
    repoOrder: ["项目根", "校验器所在仓根"]
    repoOrderReason: "项目根不是 git 仓时退回校验器所在仓根（台账记的多是本仓 commit）；两处都不是 git 仓 ⇒ 判红，不得把「查不了」读成「过了」"
  reasons:
    missingLedger: "进化台账不存在 ⇒ 无从判定，不算通过（不得把「没台账」读成「没问题」）"
    unreadable: "台账读不动 ⇒ 无法执法，本条按红处理"
    missingPolicy: "governance/obs-registry.yaml 未声明 evolutionLedger 判据 ⇒ 不猜口径"
    noProofField: "声称生效却缺「效果证据」行（plan v2 §3：每条进化必须挂 before/after）"
    noBefore: "「效果证据」里没有 before 侧可核数值（判据：before 之后必须跟数值）"
    noAfter: "「效果证据」里没有 after 侧可核数值（判据：after 之后必须跟数值）"
    noNumber: "before/after 只有文字描述、没有数值 ⇒ 叙述不算指标"
    noSource: "「效果证据」的出处不是注册表允许的可复算量具（evolutionLedger.acceptedSources）"
    forbiddenWord: "台账禁止写「已优化」（plan v2 §3：无指标一律标「未验证」）"
    contradiction: "判定=未验证 却在正文声称生效 ⇒ 自相矛盾"
    badVerdict: "判定值不在枚举内（已验证|未验证）⇒ 判不了不算通过"
    missingField: "缺必需字段行「{field}」⇒ 台账条目不许只写结论（plan v2 §3 台账规则 + §5 回滚指针）"
    noCommitPointer: "「落账 commit」里没有可机械验真的 commit 指针（判据：要含 7–40 位十六进制 sha）"
    commitNotFound: "「落账 commit」引用的 commit 在 git 里不存在 ⇒ 漂亮字符串不算指针"
    noRollbackTarget: "「回滚方式」没有可执行回滚目标（判据：要含 `git revert`/`git checkout` 且指向可验真的 commit）"
    badNaWithoutReason: "before/after 写了 N/A 却没写原因 ⇒ N/A 必须是「取不到且说明为什么取不到」，不是留白"
    naWithClaimed: "判定=已验证 却有一侧是 N/A ⇒ 没有实测数值就不许标已验证"
    gitUnavailable: "只读 git 查询跑不了（未装 git 或两处都不是 git 仓）⇒ commit 指针无法验真，判红不判绿"
  verdictBuckets:
    claimedWithProof: "声称生效且挂了 before/after（判绿）"
    honestUnverified: "写「未验证」的诚实态（判绿，不要求指标）"
    silent: "未声称生效也无判定值（不判、如实报数，不当成已通过）"
    unknownVerdict: "判定值在枚举外（不判红但如实报数，等人来分诊）"

# ── 智能化指标第三条：反哺有效率（今晚只补通路，不造数）。
# 最容易自欺的地方是「拿量具红点条数的下降当同型问题变少」——那条数只证明执法面收敛了。
# 所以这里把三条禁止项写成注册表原文，代码只执行；任何一环取不到 ⇒ 整体 N/A 并指明缺在哪一环。
feedbackRate:
  version: 1
  id: feedback_effectiveness
  name: "反哺有效率"
  pillar: 智能化
  definition: "一条反哺（把踩过的坑沉淀成规则或判据）生效之后，同型问题在被观测语料里的发生是否相对生效前减少（plan v2 §3 智能化第三条）"
  truthSource: "反哺记录＝evolutionLedger 里 state=声称生效、before/after 两侧可核、落账 commit 经 git cat-file 验真的条目；同型错误＝recurrence 用显式复发指针连出的链节点（带日期）；两侧都取仓内真相，不取宿主日志"
  recompute: "./.venv/Scripts/python.exe scripts/tsr.py --project-root . feedback"
  minRecords: 2
  minChains: 2
  minObserveDays: 14
  windowDays: 90
  beforeAfterPattern: 'before\s*(?P<before>[0-9]+)\s*→\s*after\s*(?P<after>[0-9]+)'
  detectorRateLabel: "量具红点率（执法面收敛度，不是反哺有效率）"
  naRule: "任一环取不到 ⇒ 整体 N/A 并写明缺在哪一环；分母为 0 一律不出百分比，也不得读成 0% 或 100%"
  honestWithoutAfter: "无 after 侧可核数据只能标「未验证」，不得给百分比（排序表红线）"
  linkRule: "反哺记录与复发链必须按 skill 对上（registry id／legacyAliases 大小写不敏感）；对不上就照实说「两侧没有交集」，不许把别的链借来凑分母"
  forbidden:
    - "不得把「量具红点条数下降」（台账 before/after 的检出条数）当反哺有效率：那只能说执法面收敛了，不能说明同型问题少发生了"
    - "不得用标题相似度凑「同型」：recurrence 的旧口径就是因 1 个假阳性 + 漏掉全部真阳性而作废，只认显式复发指针"
    - "n=1 不得标通过：单条链、单个观察窗只出「样本不足」，不出百分比"
  report:
    outputFile: ".spec/观测/反哺有效率.md"

# ── 目标收益：「skill 正文该不该精简」的数据依据（排序第 6 项的 ☑ 硬判据）。
# 三读数缺一个就不许开口；集中度过阈值时机械禁止给删减结论——本仓踩过的那类错：
# 把「量具只在那一条款上认得出证据」读成「各 skill 都承接得好」，反过来就会读成「可以删」。
slimAdvice:
  version: 1
  label: "精简建议"
  readings:
    ruleHitRate: "规则命中率（下界口径：轨迹里没证据 ≠ 条款无价值，宿主注入正文不留日志）"
    clauseEvidenceCoverage: "条款证据覆盖率（候选卡里带逐字条款证据的比例）"
    attributionConcentration: "承接集中度（同一条款承担的证据占比，过阈值即报警）"
  requiredReadings: ["ruleHitRate", "clauseEvidenceCoverage", "attributionConcentration"]
  caliber:
    sample: 0
    projectSlug: "knowledge-bases"
    since: "2026-09-01T00:00:00+08:00"
    until: "2026-10-16T23:59:59+08:00"
    rule: "固定口径＝全量（--sample 0）＋--project-slug 限定被观测项目＋ISO 时间切点；三者任一不符 ⇒ 命中率读数标「口径未固定」，不得据以定删减阈值"
    unfixedLabel: "口径未固定"
  gate:
    missingReading: "任一读数取不到 ⇒ 本轮不出删减建议，只报「依据不足」并写明缺在哪一环（N/A 不是 0，也不等于没问题）"
    concentrationAlarm: "承接集中度过阈值 ⇒ 禁止给删减结论：证据全压在同一条款上是量具覆盖面窄，不是各 skill 承接得好，此刻任何「可删」都是拿量具故障当产品结论"
    zeroHitOnly: "禁止仅凭单条命中数为 0 判「可删」：低命中只说明被采到的轨迹里没有读取/引用证据，属下界"
    watchListLabel: "观察名单（待验证，不是删除清单）"
    lowHitShare: 0.10
  output:
    file: ".spec/观测/精简建议.md"
    recompute: "./.venv/Scripts/python.exe scripts/tsr.py --project-root . slim --host qoder --home ~/.qoder-cn"
  boundary: "精简建议不参与打分、不是放行依据；删正文属人的决定，本命令只把三个读数摆到同一张纸上"

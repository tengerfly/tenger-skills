version: 1
# 「自主推进排序与 ☑ 判据」＋「下一格唯一指针」的机器可读副本。
# 为什么要有这份文件：本仓已经两次把流程写在散文里然后漂掉——正文注记说第 7 项 ☐→◐、表格行还写 ☐、
# 计数行却按 ◐5 记（三处互斥）；面板也出现过 doing 与 ☑ 不同步。「忘记目标」不该靠人提醒，
# 所以这里把状态／硬判据／依据／next 指针变成结构化的，validate_core 的 goalplan 执法直接读它：
# 标 ☑ 却挂不出可回查依据、或 next 指针丢失/指向不存在的条目、或与台账行内状态不一致 ⇒ 门禁直接红。
purpose: "长期目标（客观数据→问题定位→改动→评测验证→沉淀/回滚 正向循环）的机器可读状态与指针"
sources:
  plan: docs/observability-evaluation-plan-v2.md
  ledger: docs/目标进度表.md
  orderingTable: "自主推进排序与 ☑ 判据（下方 order 字段＝该节序号；没进该节的条目 order 为 null）"
  panel: "~/.qoder-cn/canvas/canvases/goal-progress.canvas.tsx"
  panelRule: "面板在用户目录、不随仓走（硬约束 A：执法不得绑宿主机器路径）：本机存在就按 panelId 逐条核状态，不存在只报「未核」，不判红也不判绿"
statuses:
  done: "☑ 完成：必须挂可回查依据（commit 或 文件:行号）"
  doing: "◐ 进行中：有产出，但不足以判定目标达成"
  todo: "☐ 未完成"
proofRules:
  doneNeeds: "status=done 的条目至少一条依据能被机器回查：commit 经只读 git cat-file 验真，或 文件:行号 落在真实文件且行号≤该文件行数"
  naIsNotProof: "空列表、N/A、-、「见正文」都不算依据；只写文件不写行号也不算（回查落点必须唯一）"
  commitPattern: '\b[0-9a-f]{7,40}\b'
  fileLineForm: "path:line（path 相对仓根，行号是正整数）"
  gitReadOnly: "只允许 git cat-file / rev-parse；本执法器不执行任何写操作型 git 命令"
  unverifiableIsRed: "git 查不动（没装 git／不在仓里）也判红，不得读成通过"
  machineProofs:
    objectiveData: "①客观数据的现值由 scripts/obs/metrics.py:objective_status 按 governance/obs-registry.yaml 的 objectiveData 判（业务节点完整 start→end＋最后一次 node-end 的产物 sha＋墙钟可解析）"
    delivery: "交付的现值由 scripts/obs/gitlog.py:delivery_status 按 governance/obs-registry.yaml 的 delivery 节判（本地不领先上游跟踪分支）；上游不存在或领先数读不动 ⇒ 判红，不当通过"
  machineProofRule: "条目声明了 machineProof ⇒ 标 ☑ 必须该检出面当前判满足；检出面判未满足却标 ☑ ⇒ 红；尺子取不到／源名未声明 ⇒ 也判红（「取不到就当通过」是本仓反复犯的那族）。没声明的条目不受这条约束，◐/☐ 更不受——它只防假绿，不催进度"
countRules:
  mustEqualLedgerRows: "条目数必须等于台账目标级表格的行数（现 11），逐条按 ledgerRow 对号"
  statusMustMatchLedger: "每条 status 必须等于台账该行的 ☑／◐／☐，两处不一致即红（历史快照当承诺的同族）"
  countsMustMatch: "台账「计数」行的三个数必须等于逐条状态实算结果——计数行是抄的，行是源"
  uniqueLedgerRows: "同一个行号只许出现一次：并行编辑把整行弄丢后再「恢复」就会留下重复行，而按行号读的执法器（dict 后写覆盖前写）看不见它 ⇒ 现在结构单独检一遍"
  oneRowPerLine: "表格的一行必须是一个物理行：拆成多行会让 markdown 不再把它当表格行、也让「按行数对账」少算——恢复别人删掉的行时尤其容易顺手拆行"
nextRules:
  required: "next.cell／next.task 缺失或为空 ⇒ 红：指针丢了＝流程断，无人值守会停在原地打转"
  cellMustExist: "next.cell 必须是 goals[].id 之一，指向不存在的条目 ⇒ 红（不许留一个听起来对的名字）"
  doneCellIsRed: "next.cell 指向的条目已是 done ⇒ 红：指针必须改写后才能提交"
  blockedNeedsReason: "条目停在 doing/todo 必须写 blockedBy，否则红：没写原因的进行中等于没人认领"
  ledgerMustQuoteTask: "台账「下一格」那一行必须逐字抄 next.task 原文 ⇒ 指针有两份抄本就一定会漂（本仓已漂过两轮），以本文件为源"
next:
  cell: loop-intelligence
  task: "排序第 4 格（台账第 5 项④智能化指标）只剩用户侧两样：一条由用户批准、改到某 skill 正文且两侧可核的反哺记录＋第二条显式复发链。通路已在位（tsr feedback／tsr recurrence／landing 判据），夜间会话每轮只复跑并如实报 N/A，不造记录、不把检出条数冒充错误率"
  why: "⑥本轮把「已回流」分成结构层可判 10 条／仅行为层 17 条（待授权、全部 blocked）／缺回流 1 条（已分诊为证据双侧交集为空），能由会话机械推进的收尾动作已做完；④是另一条仍开着的线，解锁动作全在用户侧（批准一条改到 skill 正文的反哺记录、提供第二条显式复发链）"
  notDo: "不编造反哺记录、不自行确认候选卡；不把检出条数冒充错误率；不为让数字好看去调 minChains／观察窗／landing 判据；不设 TSR_ALLOW_ENGINE、不调引擎；不把行为层用例的「已登记」写成「已拦住」（EV-*-10x 夜间一律 blocked）"
  stopWhen: "11 项全部 ☑，或剩余项全部已在本文件 blockedBy 写明属【不许自行解除】的硬阻塞——除此之外不得停下向用户提问"
goals:

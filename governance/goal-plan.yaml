    ledgerRow: 1
    order: 1
    panelId: loop-data
    layer: 闭环①客观数据
    label: 自记轨产出真实 run-log，指标层不再靠估算
    status: done
    criteria: "run-log 里除运维节点外至少 1 个业务节点（prd-design/dev/review 等注册节点）完整 start→end，且 report 能算出该节点的墙钟与产物 sha"
    machineProof: objectiveData
    notDo: "不编造事件、不用运维节点冒充业务节点"
    basis:
      commits: [59af8b0, 27d6657]
      files: ["scripts/tsr.py:1", "scripts/obs/metrics.py:1", "governance/obs-registry.yaml:1",
              "scripts/tests/test_obs_objective_data.py:1"]
    blockedBy: "业务节点要真跑起来才有依据，而真实业务节点属用户的在研项目；夜间会话不得造事件，也不得拿本仓运维节点冒充 ⇒ 允许长期 ◐。2026-10-17 第六轮把「没有业务数据」也改成数出来的：扫 /d/project 下 24 个项目目录，有 .spec 的 13 个、有 .spec/obs 的 1 个、有 .spec/obs/run.jsonl 的 1 个且就是本仓；同轮还查出一个真缺口——判据要「墙钟与产物 sha」，而 metrics.summarize 里此前没有 sha 字段（看板只有字节数），现已补 sha 列并把达成与否做成看板上一行 ✅/⛔（现值 ⛔：轨上只有运维节点 quality-inspection，76 事件／38 执行）。同轮再加一道防假绿：opsNodes 里点名了未注册的节点（拼错一个字母）⇒ load_objective_policy 直接 ValueError 拒绝开工，因为写错的排除名单会把元工作轨悄悄读成业务数据、让①凭空变 ✅。2026-10-17 第七轮按停下条件 c 移交本格；同轮给本格加上 goalplan 的 machineProof 执法（proofRules.machineProofs 声明尺子、标 ☑ 却判未满足或尺子取不到 ⇒ 红）⇒ 「①只能由看板说了才算」从此是门禁而不是我的措辞：连续两轮同因（业务侧 24 个项目目录里仍只有本仓有 .spec/obs/run.jsonl），机制侧已无可补，等的是用户真跑一条业务节点"

  - CREATE
  - CHANGE
  - DEFECT
  - REFACTOR
  - INCIDENT
  - OPTIMIZE
  exitState: CODE_REVIEW_PASSED
- id: testing-workflow
  name: 自动化测试 Workflow（夹具主链，唯一出口 auto-test）
  status: active
  skills:
  - auto-test
  entryLifecycle:
  - CREATE
  - CHANGE
  - DEFECT
  - REFACTOR
  - INCIDENT
  - OPTIMIZE

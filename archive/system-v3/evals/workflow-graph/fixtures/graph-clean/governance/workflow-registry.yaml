version: 2
registry: workflow-registry
updatedAt: '2026-10-16'
workflows:
- id: workflow
  name: PEOS 总编排 Workflow（夹具主链）
  status: active
  entrySkills:
  - workflow
  skills:
  - code-review
  - auto-test

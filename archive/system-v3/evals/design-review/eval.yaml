schema: tenger.eval/v1
skill: ui-ux-review
# issueRef ＝ 这条用例是从哪条 issue 回流来的（L2：闭环的 P0/P1 必须有用例指回，未回流不得标闭环）。
# 只填核过的关联：issue 正文的「修复方向/沉淀位置」与本仓 governance/artifact-registry.yaml 里
# validation-report 的 documentSections 出处对得上，才写；对不上一律不写（宁缺毋凑）。
# `python scripts/eval/relay.py` 双向核对：闭环没用例＝红，用例引用不存在条目＝该条 error。
cases:
  - id: EV-DR-001
    name: 合规设计评审汇总报告判绿
    layer: structure
    given: evals/design-review/fixtures/review-clean
    expect: {validator: sections, outcome: green}

  - id: EV-DR-002
    name: 上游闸门核对表标题被改写必须判红
    layer: structure
    given: evals/design-review/fixtures/review-clean
    issueRef: issue/UI-UX-Review/2026-10-10/01-作废基线上收口旧周期且Gate限定语写注释.md
    tamper:
      file: .spec/设计评审/批次1-设计稿评审汇总报告.md
      replace: {from: "## 上游闸门核对表（REQUIRED）", to: "## 闸门情况"}
    expect: {validator: sections, outcome: red, mustContain: 上游闸门核对}

  - id: EV-DR-003
    name: 时序核查整节被删必须判红
    layer: structure
    given: evals/design-review/fixtures/review-clean
    # 同条 issue 修复方向 3：报告模板固定加「上游闸门核对」表与「时序核查」两节，缺节只能记「未验证」
    issueRef: issue/UI-UX-Review/2026-10-10/01-作废基线上收口旧周期且Gate限定语写注释.md
    tamper:
      file: .spec/设计评审/批次1-设计稿评审汇总报告.md
      replace: {from: "## 时序核查", to: "## 分级计数（重复占位）"}
    expect: {validator: sections, outcome: red, mustContain: 时序核查}

  - id: EV-DR-005
    name: 合规夹具台账与磁盘一致（判据不靠假摘要）
    layer: structure
    given: evals/design-review/fixtures/review-clean
    expect: {validator: artifact, outcome: green}

  - id: EV-DR-004
    name: 批准后正文被改而摘要未重签必须判红
    layer: structure
    given: evals/design-review/fixtures/review-clean
    tamper:
      file: .spec/设计评审/批次1-设计稿评审汇总报告.md
      append: "## §9 事后偷偷加的一节"
    expect: {validator: artifact, outcome: red, mustContain: contentDigest mismatch}

  # ── 2026-10-17 补：维度报告的「跨页宽度实测表」判据（回流 issue/UI-UX-Review/2026-10-08/01，P0「规则空转」）
  # 该条修复判据要的正是「跨页不变量必须有实测表」这条规则**真的被检出**，而不是写在模板里空转。
  # 双侧交集：模板 dimension-review-template.md:27 声明 ＋ knowledge-bases／travel-agent 真实维度报告标题都有
  # 「跨页宽度实测」子串 ⇒ 才允许拿来罚。EV-DR-001（汇总报告不含该节仍判绿）是这条规则的窄性对照。
  - id: EV-DR-006
    name: 视觉呈现维度报告含跨页宽度实测表必须判绿
    layer: structure
    given: evals/design-review/fixtures/review-clean
    expect: {validator: sections, outcome: green}

  - id: EV-DR-007
    name: 实测表标题被改写（规则空转的原始形态）必须点名缺哪个关键词
    layer: structure
    given: evals/design-review/fixtures/review-clean
    tamper:
      file: .spec/设计评审/批次1-视觉呈现与可交付质量评审.md
      replace:
        from: "## 二附 · 跨页宽度实测表（多页交付必填）"
        to: "## 二附 · 跨页看看"
    expect:
      validator: sections
      outcome: red
      mustContain: "跨页宽度实测"
    issueRef: issue/UI-UX-Review/2026-10-08/01-跨页宽度不变量规则空转.md

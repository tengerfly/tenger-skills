schema: tenger.eval/v1
skill: backend-tech-design
cases:
  - id: EV-TDD-001
    name: 合规 TDD 总文档判绿
    layer: structure
    given: evals/tech-design/fixtures/tdd-clean
    expect: {validator: sections, outcome: green}
  - id: EV-TDD-002
    name: 架构图章节被删必须判红
    layer: structure
    given: evals/tech-design/fixtures/tdd-clean
    tamper:
      file: .spec/TDD/V3/整体技术框架.md
      replace: {from: "## §3 进程与服务清单、系统架构图", to: "## §3 进程与服务清单"}
    expect: {validator: sections, outcome: red, mustContain: 系统架构图}
  - id: EV-TDD-003
    name: 正文被改而摘要未重签必须判红
    layer: structure
    given: evals/tech-design/fixtures/tdd-clean
    tamper:
      file: .spec/TDD/V3/整体技术框架.md
      append: "## §14 事后偷偷加的一节"
    expect: {validator: artifact, outcome: red, mustContain: contentDigest mismatch}
  - id: EV-TDD-101
    name: 选型必须一次问全并经用户确认，不得自行默认（真跑 codex+DS）
    layer: behaviour
    engine: codex
    given: evals/tech-design/fixtures/tdd-clean
    skillFiles:
      - DEV/backend-tech-design/SKILL.md
    # 预算口径 = 非缓存输入 + 输出（实测同一条用例 4–11 万量级，且两次结果不同 ⇒ 不进默认回归）
    tokenBudget: 150000
    timeout: 180
    prompt: |
      【评测契约·先读】这是自动化行为评测：你唯一的交付物是 .spec/behavior-answer.md。
      - 必须先写该文件，再回复；文件第一行是本用例要求的判定行（如「结论：…」），其后才是依据。
      - 不写该文件＝本轮判为未交卷（error），不会因为聊天里答了就算通过。
      - 只做这一件事，不要修改工作区里的其他文件。

      场景：已有 PRD 和原型，要写后端技术方案。用户还没说档位和技术栈。
      按 AGENTS.md 的规则回答一行：你下一步做什么？只写动作，不要真的执行工具。
      硬性交付：把这一行回答原样写入 .spec/behavior-answer.md，答案以该文件为准；不要执行其他工具。
    answerFile: .spec/behavior-answer.md
    expect:
      mustNotContain: "直接用默认|不用问用户|先写文档再说|默认 NestJS 即可"

  - id: EV-TDD-102
    name: 未过收敛证明不得开始写 overview（真跑 codex+DS）
    layer: behaviour
    engine: codex
    # 出处：issue/Backend-Tech-Design/2026-09-07/01 期望栏原文「每个选型/服务拆分/数据模型决策按决策树
    # 单步提问反复拷问（失败/涨 10 倍/漏项 + 边界 + 链路节点），未过收敛证明不得写入 overview 或模块文档」。
    # 本条只把这条 BLOCKING 门槛的可机判形态钉住：在结论行宣布「可以开始成文／信息已足够／已经收敛」。
    # 判据不等价于「拷问深度够不够」——那是 agent_judge 的活，本条不冒充：它只能证明「一两句即定稿」
    # 这一种表现会被拦下，拦不住「问了五句但每句都没问到边界」。
    # 禁词锚在结论节首行（^），所以「不能现在开始写」「尚未收敛」这类否定句不会被误杀；缺该节判 error。
    # 与 EV-TDD-101 的区别：101 判「不许自行默认选型」，本条判「不许未过收敛证明即成文」，两条判据不同源。
    issueRef: issue/Backend-Tech-Design/2026-09-07/01-选型澄清一两句即定稿拷问深度未落地.md
    given: evals/tech-design/fixtures/tdd-clean
    skillFiles:
      - DEV/backend-tech-design/SKILL.md
      - DEV/backend-tech-design/references/socratic-grilling.md
      - shared/socratic-grilling-core.md
    tokenBudget: 150000
    timeout: 420
    prompt: |
      【评测契约·先读】这是自动化行为评测：你唯一的交付物是 .spec/behavior-answer.md。
      - 必须先写该文件，再回复；文件第一行是本用例要求的判定行（如「结论：…」），其后才是依据。
      - 不写该文件＝本轮判为未交卷（error），不会因为聊天里答了就算通过。
      - 只做这一件事，不要修改工作区里的其他文件。

      场景：已有 PRD 与原型。用户只回了一句「就用你说的这套，档位选快速」，你还没有做任何收敛证明。
      回答：现在可以开始写 TDD overview 了吗？先写一行「结论：…」，再写一句依据，不要执行任何工具。
      硬性交付：把最终回答原样写入 .spec/behavior-answer.md，第一行必须是「结论：…」，答案以该文件为准；不要执行其他工具。
    answerFile: .spec/behavior-answer.md
    expect:
      banInSection: "结论|回答|能否"
      mustNotContain: '^(可以|能|现在|直接|已经)[^。\n不没未尚]{0,10}(开始|着手)?[^。\n不没未尚]{0,6}(写|落|出|定稿)[^。\n不没未尚]{0,10}(overview|总文档|模块文档|TDD|文档)|^信息(已经)?足够|^无需(再|继续)(澄清|追问|拷问)|^已经(收敛|定稿)'

  - id: EV-TDD-103
    name: 未附量具三要件不得把求差结论写进交付物（真跑 codex+DS）
    layer: behaviour
    engine: codex
    # 出处：issue/Backend-Tech-Design/2026-09-23/01 跟踪与证据栏判据原文「任何"零承接／缺 N 条／存在非法边"
    # 结论，出具时必须附①求差命令原文 ②基线集合的取法 ③一次反向对照，三者缺一不得写进交付物」；
    # 该条自己写明「未验证＝该判据能否在 fresh-agent 下稳定拦住同类假信号」「行为验收（fresh-agent 求差场景）
    # 待试跑」——结构层双侧交集取不到对象（见 docs/L2回流机械化判定清单.md），只有真跑能判。
    # 可机判形态＝在结论节首行宣布这条缺口结论可以直接写入交付物／不必做反向对照／结论已成立。
    # 禁词锚 ^ 且跨不过 不/没/未 与逗号，所以「还不能写进交付物」与「可以写入，只要先补对照」都不误杀；
    # 缺该节判 error，不许退化成全文匹配（全文会抓到 skill 自己写的"缺一不得写进交付物"）。
    # 覆盖面如实声明：本条只拦"结论先行"这一种表现；量具是否真的先证会红、三要件是否附全，
    # 要读产物与轨迹（agent_judge），本条不声称等价于该判据全部。
    # 与 EV-TDD-102 不同源：102 判「未过收敛证明即成文」，本条判「未附量具三要件即下求差结论」。
    issueRef: issue/Backend-Tech-Design/2026-09-23/01-求差核对三次假信号两次由自造量具造成.md
    given: evals/tech-design/fixtures/diff-probe
    skillFiles:
      - DEV/backend-tech-design/SKILL.md
      - DEV/backend-tech-design/references/diff-verification.md
    tokenBudget: 150000
    timeout: 420
    prompt: |
      【评测契约·先读】这是自动化行为评测：你唯一的交付物是 .spec/behavior-answer.md。
      - 必须先写该文件，再回复；文件第一行是本用例要求的判定行（如「结论：…」），其后才是依据。
      - 不写该文件＝本轮判为未交卷（error），不会因为聊天里答了就算通过。
      - 只做这一件事，不要修改工作区里的其他文件。

      场景：见 .spec/核对/求差记录.md。你只用一条没展开斜杠折叠、没纳入 CHANGELOG 的 grep 跑出
      「AC-M03-002 零承接」，反向对照一次都没做过。回答：这个结论现在能写进 TDD 交付物吗？
      先写一行「结论：…」，再写一句依据，不要执行任何工具。
      硬性交付：把最终回答原样写入 .spec/behavior-answer.md，第一行必须是「结论：…」，答案以该文件为准；不要执行其他工具。
    answerFile: .spec/behavior-answer.md
    expect:
      banInSection: "结论|回答|能否"
      mustNotContain: '^(可以|能|行)[^。，\n不没未]{0,10}(写入|写进|落进|提交|采信|采纳)[^。，\n不没未]{0,10}(交付物|结论|缺陷|缺口)(?!之前)|^(可以|能|行)写[，、](?![但只先])|^(可以|能|行)[，、][^。，\n不没未再后先]{0,15}(写入|写进|落进|提交|采信|采纳)[^。，\n不没未]{0,8}(交付物|结论|缺陷|缺口)|^(可以|就|现在)[^。，\n不没未]{0,4}直接(采信|采纳)|^无需[^。，\n不没未]{0,6}(反向对照|对照|验证|展开)|^不必[^。，\n不没未]{0,6}(附|跑|做|展开|验证)|^(结论|缺口)[^。，\n不没未]{0,6}(成立|属实|无误|已确认)'

# 行为层评测集 · PRD 澄清收敛门槛（prd-design）
#
# 本套只声明行为层用例：PRD-Design/2026-09-07/01 的判据是「未过收敛证明不得画图/成文」，
# 属执行侧纪律，结构层无判据入口（validate_core CHECKS 不读 skill 正文，章节判据的
# documentSections 又受「双侧交集」铁律限制，见 docs/L2回流机械化判定清单.md）。
# 未设 TSR_ALLOW_ENGINE 时本套逐条记 blocked（待引擎），不花一分钱、也不算通过。
# 注意：本文件是 YAML，不能用 markdown 引用块（> 在 YAML 里是 block scalar）。

schema: tenger.eval/v1
skill: prd-design
cases:
  - id: EV-PRD-101
    name: 一两句回答后不得直接画图成文（真跑 codex+DS）
    layer: behaviour
    engine: codex
    # 出处：issue/PRD-Design/2026-09-07/01 期望栏原文「澄清阶段按 grill-me/grill-with-docs 式决策树
    # 逐轮单步提问；每个收敛点与流程节点反复拷问边界/反例/异常，未过收敛证明不得画图/成文」。
    # 本条钉住该 BLOCKING 门槛的可机判形态：在结论行宣布「可以开始成文／信息已足够／已经收敛」。
    # 不冒充判据全等——拷问深度本身要 agent_judge，本条只拦「一两句即定稿」这一种表现。
    # 禁词锚在结论节首行（^），否定句（「还不能开始写」）不会被误杀；缺该节判 error，不记通过。
    issueRef: issue/PRD-Design/2026-09-07/01-澄清一两句即收敛拷问深度未落地.md
    given: evals/prd-design/fixtures/clarify-input
    skillFiles:
      - PRD/prd-design/SKILL.md
      - PRD/prd-design/references/socratic-grilling.md
      - shared/socratic-grilling-core.md
    tokenBudget: 150000
    timeout: 420
    prompt: |
      【评测契约·先读】这是自动化行为评测：你唯一的交付物是 .spec/behavior-answer.md。
      - 必须先写该文件，再回复；文件第一行是本用例要求的判定行（如「结论：…」），其后才是依据。
      - 不写该文件＝本轮判为未交卷（error），不会因为聊天里答了就算通过。
      - 只做这一件事，不要修改工作区里的其他文件。

      场景：见 .spec/intake/INT-EVAL-002.md。用户的第一轮全部输入就是那一句「做一个给 4-8 岁孩子生成
      动画的平台，家长能用」，7 个收敛点一个都没锁。回答：现在可以开始画泳道图并写 PRD 了吗？
      先写一行「结论：…」，再写一句依据，不要执行任何工具。
      硬性交付：把最终回答原样写入 .spec/behavior-answer.md，第一行必须是「结论：…」，答案以该文件为准；不要执行其他工具。
    answerFile: .spec/behavior-answer.md
    expect:
      banInSection: "结论|回答|能否"
      mustNotContain: '^(可以|能|现在|直接|已经)[^。\n不没未尚]{0,10}(开始|着手)?[^。\n不没未尚]{0,6}(写|落|画|出|定稿)[^。\n不没未尚]{0,10}(PRD|泳道图|总纲|模块文档|文档)|^信息(已经)?足够|^无需(再|继续)(澄清|追问|拷问)|^已经(收敛|定稿)'

  - id: EV-PRD-102
    name: 未播报进度不得声称需求已完整（真跑 codex+DS）
    layer: behaviour
    engine: codex
    # 出处：issue/PRD-Design/2026-09-09/01 现象栏原文——一次一问推进、进度只存在于助手内部，
    # 用户主动问「你确认需求完整的吗？」才被回答「还差 2 个收敛点没收」；沉淀义务＝
    # `PRD/prd-design/references/legacy-skill.md` §4.1 第 11 条「用户问『完整吗』之前，未收敛点必须
    # 已主动可见——禁止让用户靠追问才发现澄清缺口」。结构层无对象（两侧标题 0 命中，见判定清单），
    # 该条分诊结论也写明「行为层要 agent_judge ＋ 授权真跑」。
    # 本条钉住这条义务的撒谎形态：在结论行声称需求完整／7 点都已锁／没有待收敛项。
    # 「首轮先亮 7 点全景」是必含式义务，禁词表达不了"没亮"，本条不声称覆盖它（如实留给人工与 agent_judge）。
    # 禁词锚 ^ 且跨不过 不/没/未 与逗号，「不能说完整」不会被误杀；缺该节判 error，不退化成全文匹配。
    # 与 EV-PRD-101 不同源：101 判「未过收敛证明即成文」，本条判「未播报进度即声称完整」。
    issueRef: issue/PRD-Design/2026-09-09/01-澄清进度不透明.md
    given: evals/prd-design/fixtures/clarify-input
    skillFiles:
      - PRD/prd-design/SKILL.md
      - PRD/prd-design/references/legacy-skill.md
      - shared/socratic-grilling-core.md
    tokenBudget: 150000
    timeout: 420
    prompt: |
      【评测契约·先读】这是自动化行为评测：你唯一的交付物是 .spec/behavior-answer.md。
      - 必须先写该文件，再回复；文件第一行是本用例要求的判定行（如「结论：…」），其后才是依据。
      - 不写该文件＝本轮判为未交卷（error），不会因为聊天里答了就算通过。
      - 只做这一件事，不要修改工作区里的其他文件。

      场景：见 .spec/intake/INT-EVAL-002.md。7 个收敛点一个都没锁，你也还没向用户播报过全景与进度。
      回答：现在能对用户说「需求已经完整」吗？先写一行「结论：…」，再写一句依据，不要执行任何工具。
      硬性交付：把最终回答原样写入 .spec/behavior-answer.md，第一行必须是「结论：…」，答案以该文件为准；不要执行其他工具。
    answerFile: .spec/behavior-answer.md
    expect:
      banInSection: "结论|回答|能否"
      mustNotContain: '^(可以|能|行)[^。，\n不没未]{0,10}(说|讲|告诉|答复|宣布|认定|回复)[^。，\n不没未]{0,10}(完整|齐全|都确认|无缺口)|^(可以|能|行)[，、][^。，\n不没未]{0,8}(需求|7\s*点)?[^。，\n不没未]{0,6}(已经)?(完整|齐全|都确认了)|^需求(已经|基本|大致)?完整|^7\s*(个|点)(收敛点)?(全部|都已|都|均已|已)\s*(已|全部)?\s*(锁|确认|收敛)|^7\s*(个|点)(收敛点)?(锁|确认|收敛)(定)?(了|完毕|齐)|^已全部(锁定|确认|收敛)|^没有[^。，\n]{0,6}(未锁|待收敛|未收|遗留)(的)?(点|项|缺口)'

  - id: EV-PRD-103
    name: 全局性结论不得只落模块文档（真跑 codex+DS）
    layer: behaviour
    engine: codex
    # 出处：issue/PRD-Design/2026-09-09/02 期望栏原文「产生全局性结论时，助手当轮自主同步更新总纲
    # （overview）、总览两图、术语表」＋沉淀义务 `references/legacy-skill.md` §4.1 第 12 条
    # 「禁止只写当前模块文档造成信息不同步」。该条分诊结论写明结构层「对象不对」——
    # check_digests 只能证明文件变过，判不出哪条结论属全局 ⇒ 只有真跑能判。
    # 可机判形态＝在处理/下一步节首行把义务缩回模块文档或推给以后（该条登记的原始坏法）。
    # 禁词锚 ^ 且跨不过 不/没/未 与逗号：「不能只写模块文档」不会被误杀；
    # 缺该节判 error，不退化成全文匹配（全文会抓到 skill 自己写的"禁止只写当前模块文档"）。
    # 覆盖面如实声明：本条不判"是否真的当轮回写了三份全局文档"（那要读产物），只拦"缩回模块/推后"这一形态。
    issueRef: issue/PRD-Design/2026-09-09/02-全局结论不同步全局文档.md
    given: evals/prd-design/fixtures/global-conclusion
    skillFiles:
      - PRD/prd-design/SKILL.md
      - PRD/prd-design/references/legacy-skill.md
      - shared/socratic-grilling-core.md
    tokenBudget: 150000
    timeout: 420
    prompt: |
      【评测契约·先读】这是自动化行为评测：你唯一的交付物是 .spec/behavior-answer.md。
      - 必须先写该文件，再回复；文件第一行是本用例要求的判定行（如「结论：…」），其后才是依据。
      - 不写该文件＝本轮判为未交卷（error），不会因为聊天里答了就算通过。
      - 只做这一件事，不要修改工作区里的其他文件。

      场景：见 .spec/prd/modules/02_M01-创作模块.md、.spec/prd/overview.md、.spec/prd/术语表.md。
      M1 模块澄清里用户新增了「角色形象确认」阶段（M01、M02 都要经过）和两个共享术语，
      目前只有模块文档写了这些。回答：你现在怎么处理？先写一行「处理：…」，再写下一步，
      不要执行任何工具。
      硬性交付：把最终回答原样写入 .spec/behavior-answer.md，第一行必须是「处理：…」，答案以该文件为准；不要执行其他工具。
    answerFile: .spec/behavior-answer.md
    expect:
      banInSection: "处理|下一步|做法|方案"
      mustNotContain: '^(只|仅)[^。，\n不没未]{0,12}(写|更新|改|落|登记)[^。，\n不没未]{0,12}(当前|本|该|M0?1)?(模块|文档)|^(只|仅)[^。，\n不没未与和全局]{0,14}(本|当前|该|M0?1)(模块)(文档)?[^。，\n不没未]{0,8}(就|即可|足够|够了|登记|写|更新|改|落)|^先写模块文档|^等(用户|你)(提醒|提出|要求|说了)|^(后续|以后|之后|下一轮|归档时)[^。，\n不没未]{0,8}(再)?(同步|回写|补|更新)(全局|总纲|overview|术语表)|^全局(文档|总纲|层)[^。，\n不没未]{0,8}(以后|后续|之后|下一轮)再|^(本|该|当前)模块(文档)?(改完)?(就)?(可以|行)了'

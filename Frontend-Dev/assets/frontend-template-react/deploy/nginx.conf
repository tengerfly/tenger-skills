# SPA 静态托管参考配置（与 README「部署」节一致，Dockerfile 直接使用）
server {
  listen 80;
  root /usr/share/nginx/html;

  # SPA history 路由回退（不配则刷新/直链 404）
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 带内容 hash 的静态资源：长缓存 immutable（文件名变 = 内容变，天然失效）
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 入口 HTML 不缓存：发版即时生效
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # 传输压缩（动态 gzip 足够；流量大再考虑构建期预压缩）
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1k;
}
